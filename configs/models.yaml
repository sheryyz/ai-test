# Models the agents under test can be deployed on, for `consenttrace bench`.
# Only the name of the environment variable holding each key is here; the keys live in .env (git-ignored).
# Every provider below speaks the OpenAI-compatible chat API with function calling (checked 2026-11-13).
models:
  deepseek-flash: {provider: DeepSeek, base_url: https://api.deepseek.com, model: deepseek-flash, key_env: LLM_API_KEY}
  deepseek-v4-pro: {provider: DeepSeek, base_url: https://api.deepseek.com, model: deepseek-v4-pro, key_env: LLM_API_KEY}
  qwen-flash: {provider: 通义千问, base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, model: qwen-flash, key_env: QWEN_API_KEY}
  qwen-plus: {provider: 通义千问, base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, model: qwen-plus, key_env: QWEN_API_KEY}
  glm-4.5-air: {provider: 智谱, base_url: https://open.bigmodel.cn/api/paas/v4, model: glm-4.5-air, key_env: ZHIPU_API_KEY}
  glm-5.3-flash: {provider: 智谱, base_url: https://open.bigmodel.cn/api/paas/v4, model: glm-5.3-flash, key_env: ZHIPU_API_KEY}
  qwen3.8-max: {provider: 通义千问, base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, model: qwen3.8-max, key_env: QWEN_API_KEY}
# glm-4.5-air's jailbreak/boundary/synced runs first failed on quota and were run after a top-up on
# 2026-11-13. glm-4.7 was left out: six models over three providers already carry every conclusion.
# qwen3.8-max is used only to generate test data.

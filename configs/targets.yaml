# Targets under test. Paths are relative to the project root.
targets:
  travel:
    description: 企业差旅预订 Agent（SQLite 订单库 + 差旅制度知识库）
    adapter: targets.travel_agent.adapter:TravelAgentAdapter
    contract: configs/travel_contract.yaml
    versions: [v1, v2, v2.1]
    suites:
      smoke: benchmarks/travel_smoke.yaml
      main: benchmarks/travel_main.yaml
      variants: benchmarks/travel_variants.jsonl
  approval:
    description: 审批助手 Agent（SQLite 申请单库；与差旅业务无关，验证核心可复用）
    adapter: targets.approval_agent.adapter:ApprovalAgentAdapter
    contract: configs/approval_contract.yaml
    versions: [v1]
    suites:
      core: benchmarks/approval_core.yaml

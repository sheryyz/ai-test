[project]
name = "consenttrace"
version = "0.1.0"
description = "Contract-guided testing and state-aware auditing for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.162.5",
    "uvicorn>=0.30",
    "httpx>=0.28.1",  # in-process API calls for `consenttrace report`
]

[project.scripts]
consenttrace = "consenttrace.cli:main"

[project.optional-dependencies]
baselines = [
    "deepeval>=3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.17.4",
    "httpx>=0.28.1",
    "playwright>=1.65.1",
]
targets = [
    "litellm>=1.41",
]

[tool.uv]
# The demo agents under test (targets/) need these; the ConsentTrace platform itself does not.
default-groups = ["dev", "targets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consenttrace", "targets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# deepeval / langsmith (optional "baselines" extra) ship pytest plugins we do not use
addopts = "-m 'not live and not ui' -p no:deepeval -p no:langsmith_plugin -p no:repeat -p no:rerunfailures"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real LLM API; needs LLM_API_KEY (run with -m live)",
    "ui: drives the built web console in Chromium (run with -m ui)",
]

[tool.coverage.run]
source = ["consenttrace", "targets"]
branch = true

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["*.md", "third_party"]  # vendored third-party code stays byte-for-byte upstream

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Chinese punctuation is intentional; the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"targets/travel_agent/knowledge.py" = ["E501"]  # policy passages are data
"targets/travel_agent/prompts.py" = ["E501"]  # prompt text is data

[project]
name = "consenttrace"
version = "0.1.0"
description = "Contract-guided testing and state-aware auditing for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
    "fastapi>=0.162.5",
    "uvicorn>=0.30",
]

[project.scripts]
consenttrace = "consenttrace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.17.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["consenttrace", "targets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: calls a real LLM API; needs LLM_API_KEY (run with -m live)",
]

[tool.coverage.run]
source = ["consenttrace", "targets"]
branch = true

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Chinese punctuation is intentional; the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"targets/travel_agent/knowledge.py" = ["E501"]  # policy passages are data
"targets/travel_agent/prompts.py" = ["E501"]  # prompt text is data
